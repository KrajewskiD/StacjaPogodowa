ServerRoot "/home/krajewski/Developer/ESP32/StacjaPogodowa/web"
ServerName localhost
Listen 8080
PidFile "tmp/pids/apache.pid"
DefaultRuntimeDir "tmp"

LoadModule mpm_event_module /usr/lib/httpd/modules/mod_mpm_event.so
LoadModule unixd_module /usr/lib/httpd/modules/mod_unixd.so
LoadModule authz_core_module /usr/lib/httpd/modules/mod_authz_core.so
LoadModule log_config_module /usr/lib/httpd/modules/mod_log_config.so
LoadModule proxy_module /usr/lib/httpd/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/httpd/modules/mod_proxy_http.so
LoadModule headers_module /usr/lib/httpd/modules/mod_headers.so

ServerTokens Prod
ServerSignature Off
ErrorLog "log/apache-error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b" combined
# Rotacja dzienna: 86400 sekund; pliki log/apache-access.log.YYYYMMDDHHMMSS
CustomLog "|/usr/bin/rotatelogs log/apache-access.log 86400" combined

# Nagłówki bezpieczeństwa. X-Frame-Options i X-Content-Type-Options są już dodawane
# przez Rails (default_headers) — nie dublujemy ich. TLS, HSTS i token transportu
# zostaną ustawione przy wdrożeniu na VPS, kiedy będzie dostępna domena/certyfikat.
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'"
DocumentRoot "/home/krajewski/Developer/ESP32/StacjaPogodowa/web/public"

ProxyRequests Off
ProxyPreserveHost Off
ProxyTimeout 15
ProxyPass / http://127.0.0.1:3000/ retry=0
ProxyPassReverse / http://127.0.0.1:3000/
<Proxy "http://127.0.0.1:3000/*">
  Require all granted
</Proxy>
