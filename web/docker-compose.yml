services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stacja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:-stacja_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stacja} -d ${POSTGRES_DB:-stacja_production}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?ustaw SECRET_KEY_BASE w .env}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      PUMA_BIND: tcp://0.0.0.0:3000
      RUN_DB_PREPARE: "1"
      # PostgreSQL przez zmienne składowe (bez URL — prostsza obsługa hasła).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-stacja}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      APP_HOSTS: ${APP_HOSTS:-stacjaprudnik.online,www.stacjaprudnik.online}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.0/16,127.0.0.1,::1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]

  redis_sync:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "ruby", "bin/rails", "runner", "script/redis_sync.rb"]
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RUN_DB_PREPARE: "0"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-stacja}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16