name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nie zezwalamy na rowolegla deploy — jedna zmiana naraz.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Testy Rails (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stacja
          POSTGRES_PASSWORD: stacja
          POSTGRES_DB: stacja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stacja -d stacja_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: stacja
      PGPASSWORD: stacja
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: web

      - name: Przygotowanie bazy testowej
        run: bundle exec ruby bin/rails db:prepare

      - name: Testy
        run: bundle exec ruby bin/rails test

  deploy:
    name: Deploy na VPS
    needs: test
    # Wylaczone, dopoki w repo nie ustawiono zmiennej DEPLOY_ENABLED=true
    # (Settings -> Secrets and variables -> Actions -> Variables).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja SSH (klucz deployu)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: git pull + docker compose up
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || 22 }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/stacja' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -e
             cd '$VPS_APP_DIR'
             git pull --ff-only
             cd web
             docker compose up -d --build
             docker compose ps"

      - name: Health check (HTTPS)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://stacjaprudnik.online' }}
        run: curl -fsS --retry 5 --retry-delay 5 --max-time 30 "$APP_URL/up"
