[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    https://github.com/matthias-bs/BresserWeatherSensorReceiver.git#d96c6f3bcc8e15be4487fa18d2081ea4697171a1
    jgromes/RadioLib@7.7.1
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
    vshymanskyy/Preferences@2.1.0
build_flags =
    -DDEBUG_ESP_PORT=Serial
    -DCORE_DEBUG_LEVEL=3
